name: Snowflake Core CI-CD

on:
  pull_request:
    branches: [ dev, uat, main ]
  push:
    branches: [ dev, uat, main ]

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_WAREHOUSE: W_CORE_TRANSFORM

jobs:
  # ------------------------------------------------------------------
  # PR Validation Check
  # ------------------------------------------------------------------
  ci-validation:
    name: ci-validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Snowflake Connector
        run: pip install snowflake-connector-python

      - name: Validate Scripts on Dev
        run: |
          python - <<EOF
          import os, snowflake.connector

          conn = snowflake.connector.connect(
              user=os.environ['SNOWFLAKE_USER'],
              password=os.environ['SNOWFLAKE_PASSWORD'],
              account=os.environ['SNOWFLAKE_ACCOUNT'],
              warehouse=os.environ['SNOWFLAKE_WAREHOUSE'],
              database='CORE_POC_DEV_DB',
              role='CORE_DEV_ROLE'
          )
          cs = conn.cursor()
          for script in ['scripts/01_test_table.sql', 'scripts/02_test_view.sql']:
              with open(script) as f:
                  for cmd in f.read().split(';'):
                      if cmd.strip():
                          cs.execute(cmd)
          print("PR Validation Passed!")
          cs.close()
          conn.close()
          EOF

  # ------------------------------------------------------------------
  # Deploy to Target Environment on Merge
  # ------------------------------------------------------------------
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Snowflake Connector
        run: pip install snowflake-connector-python

      - name: Deploy Scripts to Target Environment
        run: |
          python - <<EOF
          import os, snowflake.connector

          branch = "${{ github.ref_name }}"
          env_mapping = {
              "dev": ("CORE_POC_DEV_DB", "CORE_DEV_ROLE"),
              "uat": ("CORE_POC_UAT_DB", "CORE_DEV_ROLE"),
              "main": ("CORE_POC_PROD_DB", "CORE_PROD_ROLE")
          }

          target_db, target_role = env_mapping.get(branch, (None, None))
          if not target_db:
              print(f"Skipping deploy for branch {branch}")
              exit(0)

          conn = snowflake.connector.connect(
              user=os.environ['SNOWFLAKE_USER'],
              password=os.environ['SNOWFLAKE_PASSWORD'],
              account=os.environ['SNOWFLAKE_ACCOUNT'],
              warehouse=os.environ['SNOWFLAKE_WAREHOUSE'],
              database=target_db,
              role=target_role
          )
          cs = conn.cursor()
          print(f"Deploying to {target_db} using {target_role}...")

          for script in ['scripts/01_test_table.sql', 'scripts/02_test_view.sql']:
              with open(script) as f:
                  for cmd in f.read().split(';'):
                      if cmd.strip():
                          cs.execute(cmd)

          print(f"Successfully deployed to {target_db}")
          cs.close()
          conn.close()
          EOF
